{% extends "base.html" %}
{% block title %}Track your order · Servora{% endblock %}
{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
  body { background: var(--bg); }
  .tw { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; gap: 14px; padding-bottom: 18px; position: relative; color: var(--muted); }
  .steps li::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); background: var(--surface); flex: none; z-index: 1; }
  .steps li::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
  .steps li:last-child::after { display: none; }
  .steps li.done { color: var(--text); font-weight: 600; } .steps li.done::before { background: var(--success); border-color: var(--success); }
  .steps li.now::before { border-color: var(--primary); background: var(--primary); box-shadow: 0 0 0 6px var(--primary-soft); }
  #map { height: 220px; border-radius: 14px; margin-top: 12px; }
  .stars button { font-size: 30px; background: none; border: 0; cursor: pointer; color: var(--line); } .stars button.on { color: #F59E0B; }
</style>{% endblock %}
{% block body %}
<div class="tw">
  <div class="row center" style="justify-content:center;margin-bottom:16px">{% include "partials/logo_svg.html" with cls="sv-loop" uid="tr" size=56 %}</div>
  <div id="app"><div class="skeleton" style="height:300px"></div></div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const token = "{{ token|escapejs }}";
  const labels = { pending: "Order placed", accepted: "Accepted by restaurant", preparing: "Being prepared", ready: "Ready", served: "Served", out_for_delivery: "Out for delivery", delivered: "Delivered" };
  let map, marker, rated = false;
  async function load() {
    const r = await fetch(`/api/public/track/${token}`); if (!r.ok) { S.$("#app").innerHTML = '<div class="empty">Order not found.</div>'; return; }
    const o = await r.json();
    const idx = o.steps.indexOf(o.status);
    const finished = ["completed", "delivered", "served"].includes(o.status);
    S.$("#app").innerHTML = `<div class="card"><div class="row between"><div><div class="small muted">${S.esc(o.restaurant)}</div><h2 style="margin:0">Order #${S.esc(o.number)}</h2></div>
      <span class="badge ${o.status === "cancelled" ? "b-danger" : finished || o.status === "completed" ? "b-success" : "b-primary"}">${S.esc(o.status_display)}</span></div>
      ${o.delivery && o.status !== "cancelled" && !finished ? `<div class="card" style="margin-top:14px;background:var(--primary-soft);box-shadow:none;border:0"><b>Share this OTP with the rider: <span class="mono" style="font-size:20px;letter-spacing:4px">${S.esc(o.delivery.otp)}</span></b>
        <div class="small">${o.delivery.rider ? `🛵 ${S.esc(o.delivery.rider)} · <a href="tel:${S.esc(o.delivery.rider_phone)}">Call rider</a>` : "Assigning a delivery partner…"} · ETA ~${o.delivery.eta_minutes} min</div></div><div id="map" class="${o.delivery.rider_lat ? "" : "hidden"}"></div>` : ""}
      ${o.status === "cancelled" ? '<p style="margin-top:14px">This order was cancelled. Any online payment will be refunded to the original method.</p>' : `<ul class="steps" style="margin-top:18px">${o.steps.map((s, i) => `<li class="${i < idx || (o.status === "completed") ? "done" : i === idx ? "now done" : ""}">${labels[s]}</li>`).join("")}</ul>`}</div>
      <div class="card" style="margin-top:14px">${o.items.map((i) => `<div class="row between small" style="padding:4px 0"><span>${S.esc(i.qty)} × ${S.esc(i.name)}</span><span>${S.money(i.amount)}</span></div>`).join("")}
      <hr style="border:0;border-top:1px dashed var(--line)">${[["Discount", -o.discount], ["Taxes", o.tax], ["Delivery fee", o.delivery_fee], ["Packaging", o.packaging], ["Service charge", o.service_charge]].filter((x) => Number(x[1])).map((x) => `<div class="row between small"><span>${x[0]}</span><span>${S.money(x[1])}</span></div>`).join("")}
      <div class="row between" style="font-weight:800;font-size:18px;margin-top:6px"><span>Total</span><span>${S.money(o.total)}</span></div><div class="small ${o.is_paid ? "" : "muted"}" style="color:${o.is_paid ? "var(--success)" : ""}">${o.is_paid ? "✓ Paid" : "Payment pending"}</div></div>
      ${(finished || o.status === "completed") && !rated ? `<div class="card center" style="margin-top:14px" id="rate"><b>How was your food?</b><div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-r="${n}">★</button>`).join("")}</div><input id="fb" placeholder="Tell us more (optional)"><button class="btn btn-primary btn-block" id="send" style="margin-top:8px">Send feedback</button></div>` : ""}`;
    if (o.delivery && o.delivery.rider_lat && window.L && S.$("#map")) {
      map = L.map("map").setView([o.delivery.rider_lat, o.delivery.rider_lng], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
      marker = L.marker([o.delivery.rider_lat, o.delivery.rider_lng]).addTo(map).bindPopup("Your rider");
    }
    let rating = 5;
    S.$$("[data-r]").forEach((b) => (b.onclick = () => { rating = Number(b.dataset.r); S.$$("[data-r]").forEach((x) => x.classList.toggle("on", Number(x.dataset.r) <= rating)); }));
    S.$("#send") && (S.$("#send").onclick = async () => { await fetch(`/api/public/track/${token}/feedback`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rating, comment: S.$("#fb").value }) }); rated = true; S.$("#rate").innerHTML = rating >= 4 && o.review_url ? `<b>Thank you! 🙏</b><p class="small">Loved it? It would mean a lot if you shared it on Google.</p><a class="btn btn-primary" href="${S.esc(o.review_url)}" target="_blank" rel="noopener">★ Rate us on Google</a>` : "<b>Thank you! 🙏</b>"; });
    return finished || o.status === "cancelled";
  }
  let timer;
  const tick = async () => { const stop = await load(); if (!stop) timer = setTimeout(tick, 8000); };
  tick();
})();
</script>
{% endblock %}
