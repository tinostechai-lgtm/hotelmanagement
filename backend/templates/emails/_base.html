<!doctype html>
<html><body style="margin:0;background:#F6F6FA;font-family:Segoe UI,Arial,sans-serif;color:#1B1A33">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F6F6FA;padding:24px 12px"><tr><td align="center">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden">
  <tr><td style="background:#14123A;padding:20px 24px">
    {% if site_url %}<img src="{{ site_url }}/static/brand/icon-192.png" width="36" height="36" alt="" style="vertical-align:middle;border-radius:9px">{% endif %}
    <span style="color:#ffffff;font-size:20px;font-weight:800;vertical-align:middle;margin-left:8px">{{ site_name }}</span>
  </td></tr>
  <tr><td style="padding:28px 24px;font-size:15px;line-height:1.6">{% block content %}{% endblock %}</td></tr>
  <tr><td style="padding:16px 24px;background:#F0F0F6;font-size:12px;color:#6B6A85">
    Need help? {% if support_email %}<a href="mailto:{{ support_email }}" style="color:#F4632F">{{ support_email }}</a>{% endif %}{% if support_phone %} · {{ support_phone }}{% endif %}<br>
    Sent by {{ site_name }}{% if site_url %} · <a href="{{ site_url }}" style="color:#6B6A85">{{ site_url }}</a>{% endif %}
  </td></tr>
</table></td></tr></table>
</body></html>
