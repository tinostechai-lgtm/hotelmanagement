<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="Servora">
  <style>
    .tray{transform-box:fill-box;transform-origin:center;animation:tray .6s cubic-bezier(.2,.8,.2,1) both}
    .dome{transform-box:fill-box;transform-origin:50% 100%;animation:dome .7s .25s cubic-bezier(.34,1.56,.64,1) both}
    .knob{transform-box:fill-box;transform-origin:center;animation:knob .4s .7s cubic-bezier(.34,1.56,.64,1) both}
    .steam{stroke-dasharray:80;stroke-dashoffset:80;animation:steam 1s .9s ease-out forwards,float 3s 2s ease-in-out infinite}
    .shine{opacity:0;animation:shine .5s 1.1s forwards}
    .word{opacity:0;animation:word .7s 1.2s ease-out forwards}
    @keyframes tray{from{transform:scaleX(0);opacity:0}}
    @keyframes dome{from{transform:scale(.2) translateY(10px);opacity:0}}
    @keyframes knob{from{transform:scale(0)}}
    @keyframes steam{to{stroke-dashoffset:0}}
    @keyframes float{50%{transform:translateY(-2px)}}
    @keyframes shine{to{opacity:.45}}
    @keyframes word{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#F0502A"/></linearGradient></defs>
  <rect width="120" height="120" rx="30" fill="#14123A"/>
  <path class="steam" d="M69 15C62 10 51 13 53 20C55 26 67 25 67 31C67 37 57 39 51 35" fill="none" stroke="#FFD2B3" stroke-width="5" stroke-linecap="round"/>
  <path class="dome" d="M26 82a34 34 0 0 1 68 0z" fill="url(#g)"/>
  <circle class="knob" cx="60" cy="46" r="4.5" fill="url(#g)"/>
  <rect class="tray" x="18" y="86" width="84" height="8" rx="4" fill="#FFFFFF"/>
  <path class="shine" d="M40 74a22 22 0 0 1 12-17" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
  <text class="word" x="146" y="80" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="62" letter-spacing="-2" fill="#14123A">Servora</text>
</svg>
