name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python manage.py check && python manage.py test tests
        working-directory: backend
      - run: python -m unittest discover -s hardware-agent/tests
  migrate:
    # Applies migrations + plans to the production database after main is green.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set — skipping"; exit 0; fi
          python manage.py migrate --noinput && python manage.py seed
        working-directory: backend
