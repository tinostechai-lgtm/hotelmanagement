name: Android APK
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true
      - name: Generate Android platform files (keeps committed files)
        run: flutter create . --platforms=android --org com.servora --project-name servora
      - run: flutter pub get
      - name: App icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Rename
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/servora-1.0.${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/servora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: servora-android-apk
          path: mobile/build/servora-1.0.${{ github.run_number }}.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Servora Android 1.0.${{ github.run_number }}
          body: |
            Servora POS for Android — connects to https://web-rust-six-43.vercel.app
            Demo logins are on the sign-in screen (Owner, Manager, Captain, Cashier, Kitchen, Rider, Store).
          files: |
            mobile/build/servora-1.0.${{ github.run_number }}.apk
            mobile/build/servora.apk
          make_latest: true
