name: Android APK
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true
      - name: Generate Android platform files (keeps committed files)
        run: flutter create . --platforms=android --org com.servora --project-name servora
      - run: flutter pub get
      - name: App icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Rename
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/servora-1.0.${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/servora.apk
      - name: Publish APK to the website (direct download)
        working-directory: .
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          cp mobile/build/servora.apk "$RUNNER_TEMP/servora.apk"
          git config user.name "servora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B publish FETCH_HEAD
            mkdir -p public/downloads
            cp "$RUNNER_TEMP/servora.apk" public/downloads/servora.apk
            SIZE=$(stat -c %s public/downloads/servora.apk)
            printf '{"version": "%s", "size_bytes": %s, "published_at": "%s", "url": "/downloads/servora.apk"}\n' "$VERSION" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/downloads/android.json
            git add public/downloads
            git commit -m "Publish Android app $VERSION [skip ci]" || exit 0
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: servora-android-apk
          path: mobile/build/servora-1.0.${{ github.run_number }}.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Servora Android 1.0.${{ github.run_number }}
          body: |
            Servora POS for Android — connects to https://web-rust-six-43.vercel.app
            Demo logins are on the sign-in screen (Owner, Manager, Captain, Cashier, Kitchen, Rider, Store).
          files: |
            mobile/build/servora-1.0.${{ github.run_number }}.apk
            mobile/build/servora.apk
          make_latest: true
